name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Required so the action can post the signing comment, set the PR status,
# and commit the signatures file.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are recorded (committed to this repo on `branch`).
          path-to-signatures: 'signatures/version1/cla.json'
          # The document contributors are agreeing to.
          path-to-document: 'https://github.com/MateusMolina/ml-safety-playbook/blob/main/CONTRIBUTING.md'
          branch: 'main'
          # The exact phrase a contributor comments to sign.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          # People/bots that never need to sign (the maintainer, Dependabot, etc.).
          allowlist: MateusMolina,dependabot[bot],*[bot]
